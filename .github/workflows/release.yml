# Stable release.
#
# Starts when you push a version tag such as v0.1.0.
# Make the tag with scripts/release.sh, it does all the checks first:
#
#   ./scripts/release.sh 0.1.0 0.2.0
#   git push --atomic origin main v0.1.0
#
# This workflow then:
#   1. checks the tag (format, platformio.ini version, commit is on main),
#   2. builds the firmware for every device,
#   3. makes a DRAFT release with the .bin files and the CHANGELOG notes.
#
# A draft is private. Read it on the Releases page, then press "Publish release".
# Only after you publish do devices see it in "Check for updates".

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'crossrose-reader/CrossRose'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a stable version like v0.1.0"
            exit 1
          fi

          INI_VERSION="$(sed -n '/^\[crossink\]$/,/^\[/s/^version = //p' platformio.ini | head -n1)"
          if [ "$INI_VERSION" != "$VERSION" ]; then
            echo "::error::platformio.ini says version $INI_VERSION, but the tag is $GITHUB_REF_NAME. Use scripts/release.sh."
            exit 1
          fi

          # The tagged commit must already be on main or on a release/ branch.
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git branch -r --contains HEAD | grep -qE '^\s*origin/(main|release/.+)$'; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main or a release/ branch."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
          - environment: sticky
            firmware: firmware-sticky
          - environment: x4-pro
            firmware: firmware-x4-pro
          - environment: x4-classic
            firmware: firmware-x4-classic
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv.
          # Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossRose
        env:
          CROSSINK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: pio run -j1 -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ needs.prepare.outputs.version }}.bin
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-firmware-*
          merge-multiple: true
          path: release-firmware

      - name: Copy this version's notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # Everything between "## [v<version>]" and the next "## [" heading.
          awk -v heading="## [v${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::No notes for v$VERSION in CHANGELOG.md. Write them on the draft release."
            echo "_Write the release notes here._" > release-notes.md
          fi
          cat release-notes.md

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: CrossRose ${{ env.VERSION }}
          body_path: release-notes.md
          # Adds the list of merged pull requests and thanks new contributors.
          generate_release_notes: true
          draft: true
          files: release-firmware/*.bin

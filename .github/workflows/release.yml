# Stable release.
#
# Starts when you push a version tag such as v0.1.0.
# Make the tag with scripts/release.sh, it does all the checks first:
#
#   ./scripts/release.sh 0.1.0 0.2.0
#   git push --atomic origin main v0.1.0
#
# This workflow then:
#   1. checks the tag (format, platformio.ini version, commit is on main, or
#      on release/MAJOR.MINOR for a vMAJOR.MINOR.x tag),
#   2. builds the firmware for every device,
#   3. makes a DRAFT release with the .bin files and the CHANGELOG notes.
#
# A draft is private. Read it on the Releases page, then press "Publish release".
# Only after you publish do devices see it in "Check for updates".

name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the publish job, which runs no build tools,
# can make the release.
permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'crossrose-reader/CrossRose'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      highest: ${{ steps.version.outputs.highest }}
      make_latest: ${{ steps.version.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          # All branches and tags, for the checks below. blob:none skips the
          # contents of old files: the checks only need commits and tags.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          if ! bash scripts/crossrose_version.sh valid "$VERSION"; then
            echo "::error::Tag $GITHUB_REF_NAME is not a stable version like v0.1.0"
            exit 1
          fi

          # Stops with an error if the version is missing or not like 0.1.0.
          INI_VERSION="$(bash scripts/crossrose_version.sh ini)"
          if [ "$INI_VERSION" != "$VERSION" ]; then
            echo "::error::platformio.ini says version $INI_VERSION, but the tag is $GITHUB_REF_NAME. Use scripts/release.sh."
            exit 1
          fi

          # The tagged commit must already be on main, or on the release
          # branch of its own line (v0.1.1 on release/0.1). Otherwise a tag
          # like v0.2.1 made on release/0.1 would ship the old 0.1 code as the
          # newest version.
          # (fetch-depth: 0 above fetched every branch as origin/<name>.)
          SHA="$(git rev-parse HEAD)"
          LINE_BRANCH="release/${VERSION%.*}"
          ON_BRANCH=""
          for BRANCH in main "$LINE_BRANCH"; do
            if git rev-parse -q --verify "refs/remotes/origin/$BRANCH" > /dev/null &&
              git merge-base --is-ancestor "$SHA" "refs/remotes/origin/$BRANCH"; then
              ON_BRANCH="$BRANCH"
              break
            fi
          done
          if [ -z "$ON_BRANCH" ]; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main or $LINE_BRANCH."
            exit 1
          fi
          echo "::notice::$GITHUB_REF_NAME is on $ON_BRANCH"

          # Devices install the release marked "latest". A patch for an older
          # line (v0.1.1 after v0.2.0) must not take that from the newest one.
          HIGHEST="$(git tag --list 'v*' | bash scripts/crossrose_version.sh highest)"
          if [ -n "$HIGHEST" ] && bash scripts/crossrose_version.sh gt "$HIGHEST" "$VERSION"; then
            MAKE_LATEST=false
            echo "::warning::v$HIGHEST is higher than $GITHUB_REF_NAME. Untick 'Set as the latest release' when you publish the draft."
          else
            MAKE_LATEST=true
          fi

          {
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "highest=$HIGHEST"
            echo "make_latest=$MAKE_LATEST"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build-firmware.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      artifact-prefix: release-firmware

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      HIGHEST: ${{ needs.prepare.outputs.highest }}
      MAKE_LATEST: ${{ needs.prepare.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-firmware-*
          merge-multiple: true
          path: release-firmware

      - name: Package the SD language files
        # The firmware builds in English only. Other menu languages and the
        # hyphenation packs install from this zip (docs/languages.md), as on
        # CrossInk releases. Plain Python, no secrets.
        run: |
          set -euo pipefail
          python3 scripts/package_languages.py \
            --version "$VERSION" \
            --source-commit "${{ needs.prepare.outputs.sha }}" --status release-build \
            --output "release-firmware/crossink-languages-$VERSION.zip"

      - name: Copy this version's notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # Everything between "## [v<version>]" and the next "## [" heading.
          awk -v heading="## [v${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::No notes for v$VERSION in CHANGELOG.md. Write them on the draft release."
            echo "_Write the release notes here._" > release-notes.md
          fi
          if [ "$MAKE_LATEST" != "true" ]; then
            # Publishing in the web page has a "Set as the latest release"
            # checkbox, and it decides. Put the warning where you will see it.
            {
              echo "> [!WARNING]"
              echo "> **Before you publish: untick \"Set as the latest release\", then delete this note.**"
              echo "> v$HIGHEST is a higher version than v$VERSION. *Check for updates* and the"
              echo "> download link use the latest release, so they would offer v$VERSION instead of v$HIGHEST."
              echo
              cat release-notes.md
            } > release-notes.tmp
            mv release-notes.tmp release-notes.md
          fi
          cat release-notes.md

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: CrossRose ${{ env.VERSION }}
          body_path: release-notes.md
          # Adds the list of merged pull requests and thanks new contributors.
          generate_release_notes: true
          draft: true
          # "false" for a patch to an older line, so it does not become the
          # release that devices install. A draft cannot be "latest" yet: when
          # you publish it in the web page, the "Set as the latest release"
          # checkbox decides. That is why the notes above carry a warning too.
          make_latest: ${{ env.MAKE_LATEST }}
          files: |
            release-firmware/*.bin
            release-firmware/crossink-languages-*.zip
